name: Spider contribution graph
on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/spider-contrib.svg"
  repository_dispatch:
    types: [update-spider-graph]   # sent by your other repos (see notify-profile.yml)
  schedule:
    - cron: "0 */6 * * *"          # safety net
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spider-graph
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Give GitHub a moment to count the new commit
        run: sleep 45
      - name: Generate graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # use secrets.GH_PAT if private contributions are missing
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/generate_spider_graph.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/spider-contrib.svg
          git diff --staged --quiet || (git commit -m "chore: update spider contribution graph" && git push)
