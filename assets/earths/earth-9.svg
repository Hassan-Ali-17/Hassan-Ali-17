<svg viewBox="0 0 560 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Earth-9: Scrabble (C++ &amp; SFML). A full digital Scrabble on a 15x15 board." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <clipPath id="sl"><rect x="0" y="16" width="560" height="9"/></clipPath>
  <pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" opacity=".28"/></pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9aa4ff" stop-opacity=".16"/><stop offset=".6" stop-color="#9aa4ff" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .lab{font:700 15px 'Courier New', Consolas, Menlo, monospace;letter-spacing:5px}
  .nm{font:700 22px 'Courier New', Consolas, Menlo, monospace;fill:#fff}
  .tg{font:14px 'Courier New', Consolas, Menlo, monospace;fill:#c4c4d0}
  .chip{font:700 11px 'Courier New', Consolas, Menlo, monospace;fill:#9aa4ff;letter-spacing:.5px}
  .dim{font:700 11px 'Courier New', Consolas, Menlo, monospace;fill:#9aa4ff;opacity:.7;letter-spacing:3px}
  .lc{animation:lc 3.6s steps(1,end) 4.05s infinite}
  .lr{animation:lr 3.6s steps(1,end) 4.05s infinite}
  .ls{opacity:0;animation:ls 3.6s steps(1,end) 4.05s infinite}
  .bd{animation:bd 3.6s steps(1,end) 4.05s infinite}
  @keyframes lc{0%,60%,100%{transform:translate(-1.5px,0)}62%{transform:translate(-8px,1px)}64%{transform:translate(4px,0)}66%{transform:translate(-1.5px,0)}}
  @keyframes lr{0%,60%,100%{transform:translate(1.5px,0)}62%{transform:translate(8px,-1px)}64%{transform:translate(-4px,0)}66%{transform:translate(1.5px,0)}}
  @keyframes ls{0%,62%,100%{opacity:0;transform:translateX(0)}63%{opacity:1;transform:translateX(22px)}65%{opacity:1;transform:translateX(-16px)}67%{opacity:0}}
  @keyframes bd{0%,60%,100%{stroke-opacity:.9}61%{stroke-opacity:.2}62%{stroke-opacity:.9}86%{stroke-opacity:.3}87%{stroke-opacity:.9}}
</style>
<rect width="560" height="190" rx="14" fill="#05050a"/>
<rect width="560" height="190" rx="14" fill="url(#fade)"/>
<rect class="bd" x="1.5" y="1.5" width="557" height="187" rx="13" fill="none" stroke="#9aa4ff" stroke-width="2"/>
<rect x="0" y="22" width="7" height="146" fill="#9aa4ff"/>
<text class="lab lc" x="28" y="36" fill="#00eaff" opacity=".8">EARTH-9</text>
<text class="lab lr" x="28" y="36" fill="#9aa4ff" opacity=".9">EARTH-9</text>
<text class="lab" x="28" y="36" fill="#fff" opacity=".9">EARTH-9</text>
<g clip-path="url(#sl)"><text class="lab ls" x="28" y="36" fill="#9aa4ff">EARTH-9</text></g>
<text class="dim" x="532" y="36" text-anchor="end">DIM-09</text>
<text class="nm" x="28" y="82">Scrabble (C++ &amp; SFML)</text>
<text class="tg" x="28" y="112">A full digital Scrabble on a 15x15 board.</text>
<rect x="28" y="138" width="41" height="24" rx="12" fill="none" stroke="#9aa4ff" stroke-opacity=".8"/><text x="48" y="154" text-anchor="middle" class="chip">C++</text><rect x="78.6" y="138" width="49" height="24" rx="12" fill="none" stroke="#9aa4ff" stroke-opacity=".8"/><text x="103" y="154" text-anchor="middle" class="chip">SFML</text><rect x="137.39999999999998" y="138" width="41" height="24" rx="12" fill="none" stroke="#9aa4ff" stroke-opacity=".8"/><text x="158" y="154" text-anchor="middle" class="chip">OOP</text>
<rect x="-90" y="184" width="90" height="3" fill="#9aa4ff" opacity=".9"><animate attributeName="x" values="-90;560" dur="3.2s" begin="4.05s" repeatCount="indefinite"/></rect>
<rect width="560" height="190" rx="14" fill="url(#sc)"/>
</svg>