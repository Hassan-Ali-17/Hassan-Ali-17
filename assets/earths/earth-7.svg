<svg viewBox="0 0 560 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Earth-7: Zaiqa On Wheels. Food and groceries, ordered and delivered." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <clipPath id="sl"><rect x="0" y="16" width="560" height="9"/></clipPath>
  <pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" opacity=".28"/></pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".16"/><stop offset=".6" stop-color="#ff7a1a" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .lab{font:700 15px 'Courier New', Consolas, Menlo, monospace;letter-spacing:5px}
  .nm{font:700 22px 'Courier New', Consolas, Menlo, monospace;fill:#fff}
  .tg{font:14px 'Courier New', Consolas, Menlo, monospace;fill:#c4c4d0}
  .chip{font:700 11px 'Courier New', Consolas, Menlo, monospace;fill:#ff7a1a;letter-spacing:.5px}
  .dim{font:700 11px 'Courier New', Consolas, Menlo, monospace;fill:#ff7a1a;opacity:.7;letter-spacing:3px}
  .lc{animation:lc 3.6s steps(1,end) 3.15s infinite}
  .lr{animation:lr 3.6s steps(1,end) 3.15s infinite}
  .ls{opacity:0;animation:ls 3.6s steps(1,end) 3.15s infinite}
  .bd{animation:bd 3.6s steps(1,end) 3.15s infinite}
  @keyframes lc{0%,60%,100%{transform:translate(-1.5px,0)}62%{transform:translate(-8px,1px)}64%{transform:translate(4px,0)}66%{transform:translate(-1.5px,0)}}
  @keyframes lr{0%,60%,100%{transform:translate(1.5px,0)}62%{transform:translate(8px,-1px)}64%{transform:translate(-4px,0)}66%{transform:translate(1.5px,0)}}
  @keyframes ls{0%,62%,100%{opacity:0;transform:translateX(0)}63%{opacity:1;transform:translateX(22px)}65%{opacity:1;transform:translateX(-16px)}67%{opacity:0}}
  @keyframes bd{0%,60%,100%{stroke-opacity:.9}61%{stroke-opacity:.2}62%{stroke-opacity:.9}86%{stroke-opacity:.3}87%{stroke-opacity:.9}}
</style>
<rect width="560" height="190" rx="14" fill="#05050a"/>
<rect width="560" height="190" rx="14" fill="url(#fade)"/>
<rect class="bd" x="1.5" y="1.5" width="557" height="187" rx="13" fill="none" stroke="#ff7a1a" stroke-width="2"/>
<rect x="0" y="22" width="7" height="146" fill="#ff7a1a"/>
<text class="lab lc" x="28" y="36" fill="#00eaff" opacity=".8">EARTH-7</text>
<text class="lab lr" x="28" y="36" fill="#ff7a1a" opacity=".9">EARTH-7</text>
<text class="lab" x="28" y="36" fill="#fff" opacity=".9">EARTH-7</text>
<g clip-path="url(#sl)"><text class="lab ls" x="28" y="36" fill="#ff7a1a">EARTH-7</text></g>
<text class="dim" x="532" y="36" text-anchor="end">DIM-07</text>
<text class="nm" x="28" y="82">Zaiqa On Wheels</text>
<text class="tg" x="28" y="112">Food and groceries, ordered and delivered.</text>
<rect x="28" y="138" width="57" height="24" rx="12" fill="none" stroke="#ff7a1a" stroke-opacity=".8"/><text x="56" y="154" text-anchor="middle" class="chip">Flask</text><rect x="95.0" y="138" width="65" height="24" rx="12" fill="none" stroke="#ff7a1a" stroke-opacity=".8"/><text x="128" y="154" text-anchor="middle" class="chip">SQLite</text><rect x="170.2" y="138" width="98" height="24" rx="12" fill="none" stroke="#ff7a1a" stroke-opacity=".8"/><text x="219" y="154" text-anchor="middle" class="chip">Full-stack</text>
<rect x="-90" y="184" width="90" height="3" fill="#ff7a1a" opacity=".9"><animate attributeName="x" values="-90;560" dur="3.2s" begin="3.15s" repeatCount="indefinite"/></rect>
<rect width="560" height="190" rx="14" fill="url(#sc)"/>
</svg>