<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="Glitching cyan and red footer banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00eaff"/>
      <stop offset=".35" stop-color="#000"/>
      <stop offset=".65" stop-color="#ff1e1e"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000" opacity=".3"/>
    </pattern>
    <clipPath id="c1"><rect x="0" y="18" width="1000" height="16"/></clipPath>
    <clipPath id="c2"><rect x="0" y="52" width="1000" height="22"/></clipPath>
    <clipPath id="c3"><rect x="0" y="88" width="1000" height="14"/></clipPath>
  </defs>
  <style>
    .s1{opacity:0;animation:j1 3.6s steps(1,end) infinite}
    .s2{opacity:0;animation:j2 3.6s steps(1,end) infinite}
    .s3{opacity:0;animation:j3 3.6s steps(1,end) infinite}
    .base{animation:fl 3.6s steps(1,end) infinite}
    .bar{animation:sweep 3.6s linear infinite}
    .txt{font:700 12px 'Courier New',monospace;letter-spacing:6px;animation:tb 3.6s steps(1,end) infinite}
    @keyframes j1{0%,15%,100%{opacity:0;transform:translateX(0)}16%{opacity:1;transform:translateX(40px)}18%{opacity:1;transform:translateX(-30px)}20%{opacity:0}60%{opacity:1;transform:translateX(-50px)}62%{opacity:1;transform:translateX(24px)}64%{opacity:0}}
    @keyframes j2{0%,35%,100%{opacity:0;transform:translateX(0)}36%{opacity:1;transform:translateX(-60px)}38%{opacity:1;transform:translateX(36px)}40%{opacity:0}82%{opacity:1;transform:translateX(44px)}84%{opacity:1;transform:translateX(-20px)}86%{opacity:0}}
    @keyframes j3{0%,48%,100%{opacity:0;transform:translateX(0)}49%{opacity:1;transform:translateX(30px)}51%{opacity:1;transform:translateX(-44px)}53%{opacity:0}92%{opacity:1;transform:translateX(-36px)}94%{opacity:1;transform:translateX(16px)}96%{opacity:0}}
    @keyframes fl{0%,58%,100%{opacity:1}59%{opacity:.55}60%{opacity:1}81%{opacity:.7}82%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(-120px)}100%{transform:translateX(1120px)}}
    @keyframes tb{0%,60%,100%{opacity:1}61%,63%{opacity:0}90%,91%{opacity:.3}}
  </style>

  <rect width="1000" height="120" fill="#05050a"/>
  <rect class="base" width="1000" height="120" fill="url(#g)"/>

  <!-- RGB-split glitch slices of the gradient -->
  <g clip-path="url(#c1)"><g class="s1"><rect width="1000" height="120" fill="#00eaff" opacity=".85"/></g></g>
  <g clip-path="url(#c2)"><g class="s2"><rect width="1000" height="120" fill="#ff1e1e" opacity=".9"/></g></g>
  <g clip-path="url(#c3)"><g class="s3"><rect width="1000" height="120" fill="#fff" opacity=".6"/></g></g>

  <!-- sweeping scan bar -->
  <rect class="bar" x="0" y="0" width="60" height="120" fill="#fff" opacity=".07"/>

  <rect width="1000" height="120" fill="url(#scan)"/>
  <text class="txt" x="500" y="66" text-anchor="middle" fill="#fff" opacity=".85">// END OF TRANSMISSION</text>
</svg>
