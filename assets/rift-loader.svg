<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200" role="img" aria-label="Animated dimensional rift portal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000"/><stop offset=".6" stop-color="#14000a"/><stop offset="1" stop-color="#ff1e1e" stop-opacity=".5"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" opacity=".28"/></pattern>
  </defs>
  <style>
    .t{font:700 15px 'Courier New',monospace;letter-spacing:5px;animation:tg 4s steps(1,end) infinite}
    @keyframes tg{0%,70%,100%{opacity:1;transform:translateX(0)}71%{opacity:.4;transform:translateX(-4px)}72%{opacity:1;transform:translateX(5px)}73%{opacity:1;transform:translateX(0)}90%{opacity:.5}91%{opacity:1}}
  </style>
  <rect width="700" height="200" rx="18" fill="#05050a"/>

  <g transform="translate(350,86)">
    <ellipse rx="150" ry="58" fill="none" stroke="#ff1e1e" stroke-width="6" opacity=".55" filter="url(#glow)"/>
    <ellipse rx="150" ry="58" fill="none" stroke="#ff1e1e" stroke-width="2.5" stroke-dasharray="18 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="122" ry="46" fill="none" stroke="#00eaff" stroke-width="2" stroke-dasharray="6 12">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="92" ry="35" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="30 20">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="70" ry="26" fill="url(#core)">
      <animate attributeName="rx" values="70;76;70" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="26;30;26" dur="2.5s" repeatCount="indefinite"/></ellipse>
    <!-- particles pulled into the rift -->
    <g fill="#00eaff">
      <circle r="2.4"><animate attributeName="cx" values="-230;0" dur="2.2s" repeatCount="indefinite"/><animate attributeName="cy" values="-50;0" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle r="2"><animate attributeName="cx" values="240;0" dur="2.8s" begin=".5s" repeatCount="indefinite"/><animate attributeName="cy" values="60;0" dur="2.8s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin=".5s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#ff1e1e">
      <circle r="2.4"><animate attributeName="cx" values="-200;0" dur="2.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="cy" values="70;0" dur="2.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1s" repeatCount="indefinite"/></circle>
      <circle r="2"><animate attributeName="cx" values="210;0" dur="2.4s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="cy" values="-60;0" dur="2.4s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.4s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <text class="t" x="350" y="176" text-anchor="middle" fill="#00eaff">ENTER THE HASSAN-VERSE</text>
  <rect width="700" height="200" rx="18" fill="url(#scan)"/>
</svg>
