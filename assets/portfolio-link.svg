<svg viewBox="0 0 640 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Open my portfolio: hassan-ali-17.github.io" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#ff1e1e"/><stop offset=".5" stop-color="#000"/><stop offset="1" stop-color="#00eaff"/></linearGradient>
  <linearGradient id="bd2" x1="0" x2="1"><stop offset="0" stop-color="#ff1e1e"/><stop offset=".5" stop-color="#7a7a86"/><stop offset="1" stop-color="#00eaff"/></linearGradient>
  <clipPath id="sl"><rect x="0" y="38" width="640" height="12"/></clipPath>
  <pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" opacity=".3"/></pattern>
  <g id="sp">
    <path d="M0,-3 L6,-10 L10,-15 M1.5,-1.5 L10,-4 L16,-8 M1.5,1.5 L10,4 L16,8 M0,3 L6,10 L10,15 M0,-3 L-6,-10 L-10,-15 M-1.5,-1.5 L-10,-4 L-16,-8 M-1.5,1.5 L-10,4 L-16,8 M0,3 L-6,10 L-10,15" fill="none" stroke="#ff1e1e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="0" cy="4.5" rx="4.6" ry="6.5" fill="#ff1e1e"/><ellipse cx="0" cy="-4" rx="3.2" ry="3.8" fill="#ff1e1e"/>
  </g>
</defs>
<style>
  .t{font:700 26px 'Courier New',Consolas,monospace;letter-spacing:1px}
  .s{font:13px 'Courier New',Consolas,monospace;letter-spacing:3px}
  .c{animation:c 3.4s steps(1,end) infinite}.r{animation:r 3.4s steps(1,end) infinite}
  .m{animation:m 3.4s steps(1,end) infinite}.x{opacity:0;animation:x 3.4s steps(1,end) infinite}
  @keyframes c{0%,60%,100%{transform:translate(-2px,0)}62%{transform:translate(-9px,2px)}64%{transform:translate(5px,-1px)}66%{transform:translate(-2px,0)}88%{transform:translate(-12px,0)}90%{transform:translate(-2px,0)}}
  @keyframes r{0%,60%,100%{transform:translate(2px,0)}62%{transform:translate(9px,-2px)}64%{transform:translate(-5px,1px)}66%{transform:translate(2px,0)}88%{transform:translate(12px,0)}90%{transform:translate(2px,0)}}
  @keyframes m{0%,59%,100%{opacity:1}60%{opacity:.35}61%{opacity:1}87%{opacity:.4}89%{opacity:1}}
  @keyframes x{0%,62%,100%{opacity:0;transform:translateX(0)}63%{opacity:1;transform:translateX(24px)}65%{opacity:1;transform:translateX(-16px)}67%{opacity:0}88%{opacity:1;transform:translateX(-20px)}90%{opacity:0}}
</style>
<rect x="2" y="2" width="636" height="92" rx="14" fill="#05050a" stroke="url(#bd2)" stroke-width="3"/>
<!-- spider hanging from the top edge -->
<line x1="52" y1="3" x2="52" y2="3" stroke="#fff" stroke-opacity=".8" stroke-width="1.2">
  <animate attributeName="y2" values="3;3;52;52;3;3" keyTimes="0;.1;.4;.6;.9;1" dur="6s" repeatCount="indefinite"/></line>
<g><use href="#sp"/>
  <animateTransform attributeName="transform" type="translate" values="52,3;52,3;52,56;52,56;52,3;52,3" keyTimes="0;.1;.4;.6;.9;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1;0 0 1 1;.5 0 .5 1;0 0 1 1"/></g>
<g transform="translate(100,0)">
  <text class="t c" x="0" y="48" fill="#00eaff" opacity=".85">hassan-ali-17.github.io</text>
  <text class="t r" x="0" y="48" fill="#ff1e1e" opacity=".85">hassan-ali-17.github.io</text>
  <text class="t m" x="0" y="48" fill="#fff">hassan-ali-17.github.io</text>
  <g clip-path="url(#sl)"><text class="t x" x="0" y="48" fill="#ff1e1e">hassan-ali-17.github.io</text></g>
  <text class="s" x="0" y="74" fill="#00eaff">ENTER THE PORTFOLIO</text>
</g>
<rect x="14" y="84" width="612" height="4" rx="2" fill="url(#bd)"/>
<rect x="-110" y="84" width="110" height="4" fill="#fff" opacity=".9"><animate attributeName="x" values="-110;640" dur="2.6s" repeatCount="indefinite"/></rect>
<rect x="2" y="2" width="636" height="92" rx="14" fill="url(#sc)"/>
</svg>
