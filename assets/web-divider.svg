<svg viewBox="0 0 1200 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Divider with a spider dropping down and climbing back up" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- same gradient as your original glitch-divider: red -> black -> cyan -->
    <linearGradient id="baseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff1e1e"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#00eaff"/>
    </linearGradient>
    <g id="sp">
      <path d="M0,-3 L6,-10 L10,-15 M1.5,-1.5 L10,-4 L16,-8 M1.5,1.5 L10,4 L16,8 M0,3 L6,10 L10,15
               M0,-3 L-6,-10 L-10,-15 M-1.5,-1.5 L-10,-4 L-16,-8 M-1.5,1.5 L-10,4 L-16,8 M0,3 L-6,10 L-10,15"
            fill="none" stroke="#ff1e1e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="0" cy="4.5" rx="4.6" ry="6.5" fill="#ff1e1e"/>
      <ellipse cx="0" cy="-4" rx="3.2" ry="3.8" fill="#ff1e1e"/>
    </g>
  </defs>

  <!-- your original bar + white sweep -->
  <rect width="1200" height="8" fill="url(#baseGrad)"/>
  <rect x="-120" y="0" width="120" height="8" fill="#ffffff" opacity="0.9">
    <animate attributeName="x" values="-120;1200" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="0.6s" repeatCount="indefinite"/>
  </rect>

  <!-- silk thread -->
  <line x1="1140" y1="8" x2="1140" y2="8" stroke="#ffffff" stroke-opacity=".8" stroke-width="1.2">
    <animate attributeName="y2" values="8;8;50;50;8;8" keyTimes="0;.10;.38;.58;.86;1" dur="6s" repeatCount="indefinite"/>
  </line>
  <!-- spider: drops, hangs, climbs back -->
  <g>
    <use href="#sp"/>
    <animateTransform attributeName="transform" type="translate"
      values="1140,8; 1140,8; 1140,52; 1140,52; 1140,8; 1140,8"
      keyTimes="0;.10;.38;.58;.86;1" dur="6s" repeatCount="indefinite"
      calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1;0 0 1 1;.5 0 .5 1;0 0 1 1"/>
  </g>
</svg>
