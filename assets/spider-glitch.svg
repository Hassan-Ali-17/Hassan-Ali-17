<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Glitching red spray-paint spider emblem</title>
  <defs>
    <!-- rough spray-paint edges -->
    <filter id="spray" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- original graffiti-style spider: compact body, thick angular legs, hand-drawn ring -->
    <g id="spider" fill="currentColor" stroke="none">
      <g filter="url(#spray)">
        <circle cx="200" cy="205" r="122" fill="none" stroke="currentColor" stroke-width="7"/>
        <g id="legsR">
          <polygon points="210,186 238,138 258,88 268,44 266,92 246,142 218,192"/>
          <polygon points="220,194 272,162 318,130 342,120 324,144 276,172 226,204"/>
          <polygon points="226,206 288,200 334,216 350,262 330,226 288,212 228,216"/>
          <polygon points="216,228 252,248 280,298 288,364 266,302 248,262 212,238"/>
        </g>
        <use href="#legsR" transform="translate(400,0) scale(-1,1)"/>
        <!-- body -->
        <path d="M200,166 L228,194 L234,222 L214,252 L200,266 L186,252 L166,222 L172,194 Z"/>
        <!-- horns / fangs -->
        <polygon points="186,184 190,156 198,180"/>
        <polygon points="214,184 210,156 202,180"/>
        <!-- paint drips -->
        <rect x="196" y="258" width="7" height="30" rx="3.5"/>
        <rect x="150" y="150" width="6" height="22" rx="3"/>
      </g>
    </g>

    <clipPath id="bandA"><rect x="0" y="90" width="400" height="38"/></clipPath>
    <clipPath id="bandB"><rect x="0" y="200" width="400" height="26"/></clipPath>
    <clipPath id="bandC"><rect x="0" y="290" width="400" height="44"/></clipPath>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" opacity=".28"/>
    </pattern>
  </defs>

  <style>
    .cyan  { color:#00eaff; animation: cyanShift 3.2s steps(1,end) infinite; }
    .red   { color:#ff8a8a; animation: redShift 3.2s steps(1,end) infinite; }
    .main  { color:#ff1e1e; animation: flicker 3.2s steps(1,end) infinite; }
    .sA    { opacity:0; color:#00eaff; animation: sliceA 3.2s steps(1,end) infinite; }
    .sB    { opacity:0; color:#ff1e1e; animation: sliceB 3.2s steps(1,end) infinite; }
    .sC    { opacity:0; color:#ffffff; animation: sliceC 3.2s steps(1,end) infinite; }
    .tag   { font: 700 13px 'Courier New', monospace; letter-spacing:4px; animation: tagBlink 3.2s steps(1,end) infinite; }

    @keyframes cyanShift {
      0%,60%,100% { transform: translate(-3px,0); }
      62% { transform: translate(-12px,3px); }
      64% { transform: translate(8px,-2px); }
      66% { transform: translate(-3px,0); }
      88% { transform: translate(-16px,-3px); }
      90% { transform: translate(6px,2px); }
      92% { transform: translate(-3px,0); }
    }
    @keyframes redShift {
      0%,60%,100% { transform: translate(3px,0); }
      62% { transform: translate(12px,-3px); }
      64% { transform: translate(-8px,2px); }
      66% { transform: translate(3px,0); }
      88% { transform: translate(16px,3px); }
      90% { transform: translate(-6px,-2px); }
      92% { transform: translate(3px,0); }
    }
    @keyframes flicker {
      0%,58%,100% { opacity:1; transform:translate(0,0); }
      59% { opacity:.25; }
      60% { opacity:1; transform:translate(2px,0); }
      63% { opacity:.4; transform:translate(-2px,1px); }
      64% { opacity:1; transform:translate(0,0); }
      87% { opacity:.2; }
      89% { opacity:1; transform:translate(3px,-1px); }
      91% { opacity:.5; }
      92% { opacity:1; transform:translate(0,0); }
    }
    @keyframes sliceA {
      0%,20%,100% { transform:translateX(0); opacity:0; }
      21% { transform:translateX(26px); opacity:1; }
      23% { transform:translateX(-20px); opacity:1; }
      25% { transform:translateX(0); opacity:0; }
      70% { transform:translateX(-30px); opacity:1; }
      72% { transform:translateX(18px); opacity:1; }
      74% { transform:translateX(0); opacity:0; }
    }
    @keyframes sliceB {
      0%,38%,100% { transform:translateX(0); opacity:0; }
      39% { transform:translateX(-34px); opacity:1; }
      41% { transform:translateX(22px); opacity:1; }
      43% { transform:translateX(0); opacity:0; }
      80% { transform:translateX(28px); opacity:1; }
      82% { transform:translateX(-16px); opacity:1; }
      84% { transform:translateX(0); opacity:0; }
    }
    @keyframes sliceC {
      0%,50%,100% { transform:translateX(0); opacity:0; }
      51% { transform:translateX(20px); opacity:1; }
      53% { transform:translateX(-26px); opacity:1; }
      55% { transform:translateX(0); opacity:0; }
      93% { transform:translateX(-22px); opacity:1; }
      95% { transform:translateX(14px); opacity:1; }
      97% { transform:translateX(0); opacity:0; }
    }
    @keyframes tagBlink {
      0%,62%,100% { opacity:1; }
      63%,65% { opacity:0; }
      88%,90% { opacity:.3; }
    }
  </style>

  <rect width="400" height="400" rx="24" fill="#000"/>

  <g class="cyan" opacity=".85"><use href="#spider"/></g>
  <g class="red" opacity=".6"><use href="#spider"/></g>
  <g class="main"><use href="#spider"/></g>

  <g clip-path="url(#bandA)"><g class="sA"><use href="#spider"/></g></g>
  <g clip-path="url(#bandB)"><g class="sB"><use href="#spider"/></g></g>
  <g clip-path="url(#bandC)"><g class="sC"><use href="#spider"/></g></g>

  <rect width="400" height="400" rx="24" fill="url(#scan)" pointer-events="none"/>
  <text class="tag" x="200" y="388" text-anchor="middle" fill="#ff1e1e">// SPIDER-VERSE</text>
</svg>
